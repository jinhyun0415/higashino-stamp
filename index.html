<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#5b6f58"><link rel="manifest" href="./manifest.json"><link rel="icon" href="./icon.svg">
<title>히가시노 게이고 도장깨기</title>
<style>
:root{--g:#5b6f58;--p:#faf9f5;--line:#e5e5dc;--muted:#74796f;--gold:#d6a83f}
*{box-sizing:border-box}body{margin:0;background:var(--p);color:#282b27;font-family:system-ui,-apple-system,"Malgun Gothic",sans-serif}
header{background:var(--g);color:white;padding:25px 18px;border-radius:0 0 22px 22px}h1{font-size:23px;margin:7px 0}header p{margin:0;font-size:13px}
main{max-width:760px;margin:auto;padding:16px 14px 40px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat,.progress,.year{background:white;border:1px solid var(--line);border-radius:14px}.stat{text-align:center;padding:13px 5px}.stat strong{display:block;color:var(--g);font-size:21px}.stat span{font-size:11px;color:var(--muted)}
.progress{padding:14px;margin:12px 0}.bar{height:8px;background:#eceee8;border-radius:20px;margin:9px 0;overflow:hidden}.fill{height:100%;background:var(--g);width:0}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.toolbar input{flex:1;min-width:150px}.toolbar input,.toolbar select,.field input,.field textarea{font:inherit;border:1px solid var(--line);background:white;border-radius:10px;padding:11px}.toolbar select{max-width:100%}.section{display:flex;justify-content:space-between;align-items:center;margin:22px 2px 10px}.section h2{font-size:17px;margin:0}.year{overflow:hidden;margin:10px 0}.yearhead{display:flex;justify-content:space-between;background:#f2f4ef;padding:13px 14px;font-weight:700}.yearhead small{color:var(--muted);font-weight:500}.book{display:flex;align-items:center;gap:10px;padding:12px;border-top:1px solid #f0f0ea}.stamp{width:38px;height:38px;flex:0 0 38px;border:1.5px dashed #b9c2b4;border-radius:50%;display:grid;place-items:center;color:#9ba797}.stamp.done{border:2px solid var(--g);background:#e8eee5;color:var(--g)}.info{flex:1;min-width:0}.title{font-size:14px;font-weight:650}.meta{font-size:11px;color:var(--muted);margin-top:3px}.stars{color:var(--gold);font-size:12px;margin-top:3px}button{cursor:pointer}.book button,.secondary{border:1px solid var(--line);background:white;border-radius:9px;padding:9px 10px;color:var(--g)}.book button.donebtn,.primary{background:var(--g);color:white;border-color:var(--g)}.primary{border:0;border-radius:10px;padding:11px 14px;font:inherit}.empty{text-align:center;color:var(--muted);padding:25px}
dialog{border:0;border-radius:18px;padding:0;width:min(92vw,480px);box-shadow:0 20px 70px #0003}dialog::backdrop{background:#18201877}.modalhead{padding:18px 20px;background:var(--g);color:white}.modalhead h2{font-size:18px;margin:0 0 4px}.modalhead p{font-size:12px;margin:0}.body{padding:18px 20px}.field{margin-bottom:14px}.field label{display:block;font-size:12px;font-weight:700;margin-bottom:6px}.field input,.field textarea{width:100%}.field textarea{min-height:90px}.rating{display:flex;gap:8px}.rating button{font-size:26px;border:0;background:transparent;color:#d8d8ce;padding:0}.rating button.active{color:var(--gold)}.actions{display:flex;justify-content:space-between;gap:8px}.right{display:flex;gap:8px}footer{text-align:center;color:var(--muted);font-size:11px;padding:14px}
</style></head><body>
<header><div style="font-size:12px;opacity:.8;letter-spacing:.08em">READING CHALLENGE</div><h1>📚 히가시노 게이고 도장깨기</h1><p>한 권씩 읽고, 나만의 독서 기록을 모아보세요.</p></header>
<main><div class="stats"><div class="stat"><strong id="done">0</strong><span>완독한 책</span></div><div class="stat"><strong id="pct">0%</strong><span>완독 진행률</span></div><div class="stat"><strong id="avg">—</strong><span>평균 별점</span></div></div>
<div class="progress"><div style="display:flex;justify-content:space-between;font-size:13px"><b id="level">🥚 시작 단계</b><span id="remaining" style="color:var(--muted)">남은 책</span></div><div class="bar"><div class="fill" id="fill"></div></div><small id="caption" style="color:var(--muted)">첫 번째 도장을 찍어보세요!</small></div>
<div class="toolbar"><input id="search" placeholder="책 제목 검색…"><select id="filter"><option value="all">전체 책</option><option value="unread">안 읽은 책</option><option value="read">읽은 책</option><option value="rated">평점 있는 책</option></select><button class="secondary" id="addBtn">＋ 책 추가</button></div>
<div class="section"><h2>연도별 책 목록</h2><small id="shown" style="color:var(--muted)"></small></div><div id="list"></div>
<footer>기록은 이 기기의 브라우저에 저장됩니다. 브라우저 데이터를 삭제하기 전 기록을 백업해 주세요.</footer></main>
<dialog id="record"><div class="modalhead"><h2 id="mTitle">독서 기록</h2><p id="mSub">읽은 날짜와 별점, 감상을 기록하세요.</p></div><form class="body" id="recordForm"><input id="id" type="hidden"><div class="field"><label for="date">읽은 날짜</label><input id="date" type="date"></div><div class="field"><label>별점</label><div id="rating" class="rating"></div></div><div class="field"><label for="review">짧은 감상</label><textarea id="review" maxlength="500" placeholder="기억에 남는 장면이나 한 줄 감상"></textarea></div><div class="actions"><button type="button" class="secondary" id="unread">읽지 않음으로</button><div class="right"><button type="button" class="secondary" id="cancel">취소</button><button class="primary">저장</button></div></div></form></dialog>
<dialog id="add"><div class="modalhead"><h2>책 추가하기</h2><p>목록에 없는 책을 직접 추가할 수 있어요.</p></div><form class="body" id="addForm"><div class="field"><label for="newTitle">책 제목 *</label><input id="newTitle" required maxlength="100"></div><div class="field"><label for="newYear">일본 초판 출간 연도 (선택)</label><input id="newYear" type="number" min="1950" max="2035" placeholder="예: 2020"></div><div class="actions"><span></span><div class="right"><button type="button" class="secondary" id="cancelAdd">취소</button><button class="primary">추가</button></div></div></form></dialog>
<script>
const BOOKS=[
[1985,"방과 후"],[1986,"졸업"],[1987,"백마산장 살인사건"],[1988,"학생가의 살인"],[1989,"잠자는 숲"],[1989,"십자 저택의 피에로"],[1990,"브루투스의 심장"],[1990,"회랑정 살인사건"],[1991,"숙명"],[1992,"변신"],[1992,"분신"],[1993,"아름다운 흉기"],[1994,"옛날에 내가 죽은 집"],[1995,"가면산장 살인사건"],[1996,"명탐정의 규칙"],[1996,"탐정 갈릴레오"],[1998,"비밀"],[1999,"백야행"],[2000,"짝사랑"],[2001,"편지"],[2002,"레몬"],[2003,"용의자 X의 헌신"],[2004,"환야"],[2005,"방황하는 칼날"],[2006,"붉은 손가락"],[2006,"거짓말, 딱 한 개만 더"],[2008,"유성의 인연"],[2009,"신참자"],[2010,"플래티나 데이터"],[2011,"기린의 날개"],[2012,"나미야 잡화점의 기적"],[2013,"기도의 막이 내릴 때"],[2015,"라플라스의 마녀"],[2016,"위험한 비너스"],[2017,"그대 눈동자에 건배"],[2018,"마력의 태동"],[2019,"녹나무의 파수꾼"],[2021,"백조와 박쥐"],[2023,"당신이 누군가를 죽였다"]
].map((x,i)=>({id:"b"+i,year:x[0],title:x[1]}));
const KEY="higashino_stamp_v1";let records={},custom=[],stars=0;
try{const s=JSON.parse(localStorage.getItem(KEY)||"{}");records=s.records||{};custom=s.custom||[]}catch(e){}
const $=x=>document.getElementById(x), all=()=>[...BOOKS,...custom].sort((a,b)=>(b.year||0)-(a.year||0)||a.title.localeCompare(b.title,"ko"));
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function save(){localStorage.setItem(KEY,JSON.stringify({records,custom}));render()}
function render(){let books=all(),done=books.filter(b=>records[b.id]?.done).length,ratings=books.map(b=>records[b.id]?.rating).filter(Boolean),pct=Math.round(done/books.length*100);
$("done").textContent=done;$("pct").textContent=pct+"%";$("avg").textContent=ratings.length?(ratings.reduce((a,b)=>a+b,0)/ratings.length).toFixed(1)+" ★":"—";$("remaining").textContent="남은 책 "+(books.length-done)+"권";$("fill").style.width=pct+"%";$("level").textContent=done===0?"🥚 시작 단계":done>=books.length?"👑 완독 달성!":done>=50?"🥇 금메달 단계":done>=20?"🥈 은메달 단계":done>=10?"🥉 동메달 단계":"🌱 차근차근 읽는 중";$("caption").textContent=`총 ${books.length}권 중 ${done}권 완독`;
let q=$("search").value.trim().toLowerCase(),f=$("filter").value;let list=books.filter(b=>{let r=records[b.id]||{};return(!q||b.title.toLowerCase().includes(q))&&(f==="all"||(f==="unread"&&!r.done)||(f==="read"&&r.done)||(f==="rated"&&r.rating))});$("shown").textContent=list.length+"권 표시";let groups={};list.forEach(b=>{let y=b.year||"연도 미상";(groups[y]??=[]).push(b)});
$("list").innerHTML=Object.keys(groups).sort((a,b)=>Number(b||0)-Number(a||0)).map(y=>`<section class="year"><div class="yearhead"><span>${esc(y)}년</span><small>${groups[y].filter(b=>records[b.id]?.done).length}/${groups[y].length} 완독</small></div>${groups[y].map(b=>{let r=records[b.id]||{},d=!!r.done;return `<div class="book"><div class="stamp ${d?"done":""}">${d?"✓":"○"}</div><div class="info"><div class="title">${esc(b.title)}</div><div class="meta">${d?"완독 "+esc(r.date||"기록"):"아직 읽지 않음"}${r.review?" · 감상 있음":""}</div>${r.rating?`<div class="stars">${"★".repeat(r.rating)}${"☆".repeat(5-r.rating)}</div>`:""}</div><button class="${d?"donebtn":""}" data-id="${esc(b.id)}">${d?"기록 보기":"기록하기"}</button></div>`}).join("")}</section>`).join("")||'<div class="empty">조건에 맞는 책이 없어요.</div>';
document.querySelectorAll("[data-id]").forEach(b=>b.onclick=()=>openRecord(b.dataset.id))}
function drawStars(){$("rating").innerHTML=[1,2,3,4,5].map(n=>`<button type="button" class="${n<=stars?"active":""}" data-star="${n}">★</button>`).join("");document.querySelectorAll("[data-star]").forEach(b=>b.onclick=()=>{stars=+b.dataset.star;drawStars()})}
function openRecord(id){let b=all().find(x=>x.id===id),r=records[id]||{};$("id").value=id;$("mTitle").textContent=b.title;$("mSub").textContent=(b.year?b.year+"년 출간 · ":"")+"독서 기록을 남겨보세요.";$("date").value=r.date||new Date().toISOString().slice(0,10);$("review").value=r.review||"";stars=r.rating||0;drawStars();$("record").showModal()}
$("recordForm").onsubmit=e=>{e.preventDefault();records[$("id").value]={done:true,date:$("date").value,rating:stars,review:$("review").value.trim()};$("record").close();save()};
$("unread").onclick=()=>{delete records[$("id").value];$("record").close();save()};$("cancel").onclick=()=>$("record").close();$("search").oninput=render;$("filter").onchange=render;
$("addBtn").onclick=()=>{$("newTitle").value="";$("newYear").value="";$("add").showModal()};$("cancelAdd").onclick=()=>$("add").close();
$("addForm").onsubmit=e=>{e.preventDefault();custom.push({id:"c"+Date.now(),title:$("newTitle").value.trim(),year:+$("newYear").value||null});$("add").close();save()};
if("serviceWorker"in navigator&&location.protocol.startsWith("http"))addEventListener("load",()=>navigator.serviceWorker.register("./service-worker.js").catch(()=>{}));render();
</script></body></html>
