 current=b; const r=records[b.id]||{}; rating=r.rating||0;
 $('modalTitle').textContent=b.title; $('modalMeta').textContent=b.year+'년 출간 · 도장깨기 기록';
 $('date').value=r.date||''; $('note').value=r.note||''; drawStars(); $('overlay').style.display='flex';
}
function drawStars(){$('stars').innerHTML='';for(let i=1;i<=5;i++){let s=document.createElement('button');s.className='star '+(i<=rating?'on':'');s.textContent='★';s.onclick=()=>{rating=i;drawStars()};$('stars').appendChild(s)}}
$('save').onclick=()=>{
 const date=$('date').value, note=$('note').value.trim();
 records[current.id]={done:true,date,rating,note}; saveAll(); $('overlay').style.display='none'; render(); toast('기록을 저장했어요 ✨');
};
$('close').onclick=()=>$('overlay').style.display='none';
$('overlay').onclick=e=>{if(e.target===$('overlay'))$('overlay').style.display='none'};
$('search').oninput=render;$('year').onchange=render;
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));b.classList.add('active');filter=b.dataset.filter;render()});
function toast(t){$('toast').textContent=t;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),1600)}
render();
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./service-worker.js').catch(() => {});
  });
}
</script>
</body></html>
